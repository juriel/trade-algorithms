[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado (0.0005 = 0.05%)
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Venta ---
target_pct          = 0.04    # meta de venta (+4%); None = sin meta
max_hold_days       = 15      # vender a la apertura tras N días; None = sin límite

# --- Algoritmo 03: retorno a la media ---
stoch_max           = 20.0    # comprar solo si Estocástico %K de ayer es menor a este valor
exit_at_middle_band = True    # vender a la apertura si ayer el cierre alcanzó la banda media
