[walkforward]
# --- Calendario ---
data_start      = 1990-01-01   # primer año usado (hay VIX y amplitud de mercado desde aquí)
holdout_start   = 2024-01-01   # DESDE esta fecha el periodo queda RESERVADO: solo se usa en `--stage final`, una vez
train_years     = 10           # ventana de entrenamiento (se desliza)
test_years      = 3            # ventana de prueba inmediatamente posterior (fuera de muestra)
step_years      = 3            # avance entre pliegues

# --- Pruebas (carteras de 20 acciones, ver portfolio.cfg) por pliegue ---
train_tests     = 16
test_tests      = 24

# --- Búsqueda (optimización bayesiana TPE de Optuna) ---
trials          = 60           # evaluaciones por pliegue; la primera es la configuración actual
top_candidates  = 8            # candidatos finalistas para el análisis de meseta
neighbors       = 6            # vecinos por candidato (todos los parámetros numéricos movidos hasta ±perturbation a la vez)
perturbation    = 0.10
min_trades      = 20           # operaciones mínimas en las pruebas de entrenamiento; menos = candidato descartado
seed            = 2026
