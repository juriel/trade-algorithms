[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado (0.0005 = 0.05%)
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Venta ---
target_pct        = 0.05      # meta de venta (+5%); None = sin meta
max_hold_days     = 10        # vender a la apertura tras N días; None = sin límite

# --- Algoritmo 01: rebote por sobreventa ---
rsi_buy           = 30.0      # comprar si el RSI(14) de ayer es menor a este valor
rsi_sell          = 70.0      # vender a la apertura si el RSI de ayer supera este valor
use_trend_filter  = True      # exigir cierre de ayer sobre la SMA200
