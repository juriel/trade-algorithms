[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Venta ---
target_pct        = 0.04      # meta de venta; None = sin meta
max_hold_days     = 8        # vender a la apertura tras N días; None = sin límite

# --- Algoritmo 01b: RSI + Estocástico, sin filtro de tendencia ---
rsi_buy           = 35.0      # comprar si RSI de ayer < este valor
stoch_max         = 20.0      # y Estocástico %K de ayer < este valor
rsi_sell          = 60.0      # vender a la apertura si RSI de ayer > este valor

# --- Mejora i2: más tamaño con IBS muy bajo ---
ibs_boost_max       = 0.07      # IBS de ayer igual o menor a este valor => posición aumentada
boost               = 1.5       # multiplicador del tamaño cuando se cumple

# --- IA (meta-etiquetado) ---
margin              = 0.0       # se exige P(ganar) >= tasa histórica de acierto + margin (más margen = más selectivo)
