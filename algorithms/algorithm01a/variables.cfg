[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Venta ---
target_pct        = 0.05      # meta de venta; None = sin meta
max_hold_days     = 10        # vender a la apertura tras N días; None = sin límite

# --- Algoritmo 01a: Rebote RSI con giro al alza ---
rsi_buy           = 30.0      # comprar si el RSI de ayer < este valor
rsi_sell          = 65.0      # vender a la apertura si el RSI de ayer > este valor
require_rising    = True      # exigir que el RSI de ayer sea mayor al de anteayer
