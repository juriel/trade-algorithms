[portfolio]
# --- Sorteo de cada prueba: un periodo y n_stocks acciones al azar que tengan datos en ese periodo ---
n_stocks        = 20        # acciones por prueba
min_eligible    = 25        # el periodo se sortea solo entre fechas con al menos esta cantidad de acciones con historia
lead_bars       = 150       # jornadas previas al periodo (solo para calcular indicadores/señales; no se opera)

# --- Cartera ---
max_positions   = 10        # posiciones abiertas a la vez; cada una usa 1/max_positions del capital actual
initial_capital = 100000
# El largo del periodo (300-600 jornadas) sale de min_bars/max_bars de genetic.cfg.
