[ga]
# --- Muestreo (por cada algoritmo se sortea su propio conjunto) ---
n_symbols       = 50      # acciones al azar por algoritmo
min_bars        = 300     # largo mínimo del periodo (barras/días de mercado)
max_bars        = 600     # largo máximo del periodo
warmup_bars     = 200     # el periodo no empieza antes de esta barra (indicadores ya calculados)

# --- Algoritmo genético ---
population      = 30
generations     = 20
elite           = 2       # mejores que pasan intactos a la siguiente generación
tournament      = 3       # tamaño del torneo de selección
crossover_rate  = 0.8
mutation_rate   = 0.2     # probabilidad de mutar cada gen
seed            = None    # entero para resultados reproducibles

# --- Fitness = alpha de timing medio% - dd_penalty * |max drawdown| medio% ---
# (alpha = CAGR menos el de una cartera con la misma exposición; ya no premia quedarse en efectivo)
dd_penalty      = 0.0
min_trades      = 30      # operaciones totales mínimas en la muestra; menos => fitness penalizado

# --- Validación fuera de muestra con otras 50 acciones/periodos al azar ---
validate        = True
db_path         = data/stocks.db
