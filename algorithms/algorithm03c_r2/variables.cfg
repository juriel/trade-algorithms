[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Salidas (todas se ejecutan a la apertura, salvo la meta que es orden límite) ---
target_pct        = 0.04      # meta fija (+%); se usa si target_atr_mult es None. None = sin meta
max_hold_days     = 8        # vender a la apertura tras N días; None = sin límite
stop_pct          = None        # vender a la apertura si el cierre de ayer cayó este % bajo la entrada; None = sin stop

# --- Algoritmo 03c_r2 ---
mfi_max             = 20.0      # comprar solo si MFI(14) de ayer < este valor
rsi_max             = 35.0      # comprar solo si RSI(14) de ayer < este valor
max_atr_regime      = 1.8       # ATR% de ayer / su media de 100 días; máximo permitido
stop_atr_mult       = 2.0       # stop = este múltiplo del ATR% de ayer
