[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Salidas (todas se ejecutan a la apertura, salvo la meta que es orden límite) ---
target_pct        = None      # meta fija (+%); se usa si target_atr_mult es None. None = sin meta
max_hold_days     = None        # vender a la apertura tras N días; None = sin límite
stop_pct          = None        # vender a la apertura si el cierre de ayer cayó este % bajo la entrada; None = sin stop

# --- Algoritmo 02_v1_r2 ---
adx_min             = 20.0      # ADX(14) mínimo para comprar
min_macd_pct        = 0.5       # histograma MACD mínimo en % del precio
min_bb_width        = 12.0      # ancho de Bollinger mínimo en % de la banda media
chandelier_window   = 22        # ventana del máximo del trailing Chandelier (cierre)
chandelier_k        = 4.0       # distancia base del trailing en múltiplos de ATR
max_k_scale         = 1.5       # la distancia se multiplica por min(ATR-régimen, este valor), con piso 1
