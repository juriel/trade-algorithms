[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Salidas (todas se ejecutan a la apertura, salvo la meta que es orden límite) ---
target_pct        = 0.05      # meta fija (+%); se usa si target_atr_mult es None. None = sin meta
max_hold_days     = 5        # vender a la apertura tras N días; None = sin límite
stop_pct          = None        # vender a la apertura si el cierre de ayer cayó este % bajo la entrada; None = sin stop

# --- Algoritmo 03a_v2_r2 ---
rsi_max             = 30.0      # comprar solo si RSI(14) de ayer < este valor
min_bb_width        = 12.0      # ancho de Bollinger mínimo en % de la banda media
max_dist_sma50      = -9.0      # distancia máxima del cierre a la SMA50, en % (negativo = por debajo)
ibs_max             = 0.25      # IBS máximo de ayer
target_atr_mult     = 1.5       # meta = este múltiplo del ATR% de ayer
stop_atr_mult       = 2.0       # stop = este múltiplo del ATR% de ayer

# --- Mejora i2: tamaño de posición proporcional a la profundidad ---
size_ref_drop       = 10.0      # caída % a 5 días que corresponde al tamaño normal
size_min            = 0.5       # multiplicador mínimo del tamaño
size_max            = 3.0       # multiplicador máximo del tamaño

# --- control aleatorio ---
keep_frac           = 0.59      # fracción de señales que deja pasar el control aleatorio
