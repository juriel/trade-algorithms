[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Venta ---
target_pct        = 0.05      # meta de venta; None = sin meta
max_hold_days     = 15        # vender a la apertura tras N días; None = sin límite

# --- Algoritmo 03c: Bollinger inferior + MFI (volumen) ---
mfi_max           = 20.0      # comprar solo si MFI(14) de ayer < este valor
use_trend_filter  = False     # exigir cierre sobre la SMA200

# --- Filtro de mercado (m2: solo con estrés en expansión) ---
vix_ratio50_min     = 1.3       # VIX / su media de 50 días igual o mayor a este valor
credit_ret20_max    = -4.0      # variación % a 20 días de HYG/LQD igual o menor a este valor
spx_ret20_max       = -8.0      # variación % del S&P 500 a 20 días igual o menor a este valor
