[params]
# --- Variables comunes ---
initial_capital   = 10000     # capital inicial
position_fraction = 1.0       # fracción del capital invertida en cada compra (0-1)
commission_pct    = 0.0005    # comisión por operación, cada lado
slippage_pct      = 0.0005    # deslizamiento en ejecuciones a mercado (aperturas)

# --- Salidas (todas se ejecutan a la apertura, salvo la meta que es orden límite) ---
target_pct        = 0.06      # meta fija (+%); se usa si target_atr_mult es None. None = sin meta
max_hold_days     = 12        # vender a la apertura tras N días; None = sin límite
stop_pct          = None        # vender a la apertura si el cierre de ayer cayó este % bajo la entrada; None = sin stop

# --- Algoritmo 02c_v1 ---
rsi_max             = 50.0      # comprar el retroceso si RSI de ayer < este valor
rsi_sell            = 70.0      # vender a la apertura si RSI de ayer > este valor
adx_min             = 25.0      # ADX(14) mínimo para comprar
max_dist_sma20      = -1.5      # retroceso mínimo: distancia del cierre a la SMA20 en % (negativo = por debajo)
target_atr_mult     = 2.0       # meta = este múltiplo del ATR% de ayer; None = usar target_pct
stop_atr_mult       = 2.5       # stop = este múltiplo del ATR% de ayer; None = usar stop_pct
